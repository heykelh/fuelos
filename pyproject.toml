[project]
name = "fuelos"
version = "0.1.0"
description = "FUELOS : Fuel Operations Study, analyse de l'efficacité carburant des opérations aériennes sur données ouvertes"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
